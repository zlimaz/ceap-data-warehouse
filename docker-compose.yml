services:
  postgres:
    image: postgres:15-alpine
    container_name: ceap_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ceap_dw
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin_password
      TZ: America/Sao_Paulo
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d ceap_dw"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
