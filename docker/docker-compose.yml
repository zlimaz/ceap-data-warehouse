
version: '3.8'

services:
  #Postgres
  db:
    image: postgres:15-alpine
    container_name: sbd2_postgres_container
    environment:
      POSTGRES_USER: sbd2_user
      POSTGRES_PASSWORD: sbd2_password
      POSTGRES_DB: sbd2_database
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  #pgAdmin
  pgadmin:
    image: dpage/pgadmin4
    container_name: sbd2_pgadmin_container
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@sbd2.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - db

volumes:
  postgres_data: